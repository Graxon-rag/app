services:
  graxon-app:
    container_name: graxon_app_dev

    image: oven/bun:1-alpine
    working_dir: /graxon/app

    ports:
      - "5995:5995"

    environment:
      - VITE_SERVER_URL=http://localhost:8888
      - VITE_MINIO_URL=http://localhost:9001

    volumes:
      - .:/graxon/app

    command: >
      sh -c "
        bun install --no-cache &&
        bun run dev --host 0.0.0.0 --port 5995
      "

    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:5995 > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

    restart: always
